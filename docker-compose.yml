version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: studyroom
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/studyroom
      SECRET_KEY: supersecretkey123
      DEBUG: true

volumes:
  postgres_data:
