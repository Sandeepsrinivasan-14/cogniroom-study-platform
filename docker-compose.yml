version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: studyroom
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/studyroom
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: supersecretkey123
      DEBUG: true

volumes:
  postgres_data:
  redis_data:
