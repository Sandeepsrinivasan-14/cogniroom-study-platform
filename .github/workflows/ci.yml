name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt pytest
      - name: Run tests
        run: |
          set +e
          python -m pytest -q --tb=short 2>&1 | tee pytest.log
          rc=${PIPESTATUS[0]}
          # Surface the first failures as annotations so they show on the PR checks page.
          grep -E "^(FAILED|ERROR)|^E  " pytest.log | head -8 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
          exit $rc

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
